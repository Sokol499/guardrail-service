services:
  guardrail:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - POLICY_DATA_PATH=/app/data/policies/policy_chunks.json
    volumes:
      - chroma_data:/app/data/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  ingest:
    build: .
    command: python scripts/ingest_policies.py
    env_file:
      - .env
    environment:
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - POLICY_DATA_PATH=/app/data/policies/policy_chunks.json
    volumes:
      - chroma_data:/app/data/chroma
    profiles:
      - setup

volumes:
  chroma_data:
